name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install 'uv==0.12.1'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --locked python scripts/release_check.py
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts
      - run: npm run test:ui
      - run: npm audit --audit-level=high
      - run: uv run --locked python -m compileall -q sub2easy tests
      - run: uv build
      - name: Inspect and install the actual wheel
        shell: bash
        run: |
          uv run python scripts/release_check.py --archive dist/*.whl --archive dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          python scripts/smoke_wheel.py --python "$RUNNER_TEMP/wheel-smoke/bin/python"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/sub2easy" --help
      - name: Export clean source
        run: uv run python scripts/export_source.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: release-candidate
          path: dist/
          retention-days: 7
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'uv==0.12.1'
      - run: uv export --locked --no-dev --no-emit-project --no-hashes -o /tmp/sub2easy-requirements.txt
      - run: uv tool run pip-audit -r /tmp/sub2easy-requirements.txt --no-deps --disable-pip
